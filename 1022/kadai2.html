<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

    <style>
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
        }

        button {
            font-size: 20px;
            padding: 12px 20px;
            border: none;
            background-color: royalblue;
            color: white;
            border-radius: 10px;
            margin-right: 10px;
            margin-top: 10px;
        }

        select {
            font-size: 18px;
            padding: 10px 12px;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div id="hud">
        <select id="animationSelect">
            <option value="AnimalArmature|Walk" selected>あるく</option>
            <option value="AnimalArmature|Gallop">はしる</option>
            <option value="AnimalArmature|Idle">待機1</option>
            <option value="AnimalArmature|Idle_2">待機2</option>
            <option value="AnimalArmature|Eating">たべる</option>
            <option value="AnimalArmature|Attack">こうげき</option>
            <option value="AnimalArmature|Jump_ToIdle">ジャンプ</option>
            <option value="AnimalArmature|Death">たおれる</option>
        </select>

        <br>

        <button id="enlargeButton">拡大</button>
        <button id="shrinkButton">縮小</button>
        <button id="rotateButton">回転</button>
        <button id="reverseButton">逆回転</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam">

        <a-marker preset="hiro" smooth="true">

            <a-entity id="model" position="0 0 0.5">

                <a-gltf-model
                    id="husky"
                    src="../assets/Husky.glb"
                    position="0 0 0"
                    scale="0.4 0.4 0.4"
                    rotation="-90 0 0"
                    animation-mixer="clip: AnimalArmature|Walk">
                </a-gltf-model>

            </a-entity>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

    <script>
        const husky = document.getElementById("husky");
        const animationSelect = document.getElementById("animationSelect");
        const model = document.getElementById("model");

        const enlargeButton = document.getElementById("enlargeButton");
        const shrinkButton = document.getElementById("shrinkButton");
        const rotateButton = document.getElementById("rotateButton");
        const reverseButton = document.getElementById("reverseButton");

        function changeAnimation() {
            husky.setAttribute("animation-mixer", "clip", animationSelect.value);
        }

        animationSelect.addEventListener("change", changeAnimation);

        let size = 1;

        function enlargeModel() {
            size = size + 0.1;
            model.setAttribute("scale", `${size} ${size} ${size}`);
        }

        enlargeButton.addEventListener("click", enlargeModel);

        function shrinkModel() {
            if (size > 0.2) {
                size = size - 0.1;
                size = Math.round(size * 10) / 10;
                model.setAttribute("scale", `${size} ${size} ${size}`);
            }
        }

        shrinkButton.addEventListener("click", shrinkModel);

        let angle = 0;

        function rotateModel() {
            angle += 15;
            model.setAttribute("rotation", `0 0 ${angle}`);
        }

        rotateButton.addEventListener("click", rotateModel);

        function reverseModel() {
            angle -= 15;
            model.setAttribute("rotation", `0 0 ${angle}`);
        }

        reverseButton.addEventListener("click", reverseModel);
    </script>

</body>

</html>
