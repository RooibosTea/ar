<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-vr-kit@v0.2.0/vr-kit.js"></script>


    <style>
        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 999;
            padding: 12px;
        }

        select {
            font-size: 18px;
            padding: 4px 8px;
            width: 200px;
        }
    </style>

</head>

<body>

    <div id="hud">
        <select name="" id="avatarChoice">
            <option value="../assets/robot.glb">ロボット</option>
            <option value="../assets/wolf.glb">おおかみ</option>
            <option value="../assets/Horse.glb">うま</option>
        </select>

        <br><br>

        <select id="timeChoice">
            <option value="morning">朝</option>
            <option value="noon" selected>昼</option>
            <option value="evening">夕方</option>
            <option value="night">夜</option>


        </select>

        <br><br>

        <select id="fieldChoice">
            <option value="grass">草原</option>
            <option value="snow">雪原</option>
            <option value="desert">砂漠</option>
            <option value="volcano">火山</option>
        </select>



    </div>
    <a-scene>
        <a-sky id="sky" color="#87CEEB"></a-sky>

        <a-light id="sun" type="ambient" color="#FFFFFF" intensity="1">
        </a-light>

        <a-plane id="ground" rotation="-90 0 0" width="30" height="30" color="darkseagreen">
        </a-plane>

        <a-entity id="avatar" gltf-model="../assets/robot.glb" position="0 0 -3" scale="0.3 0.3 0.3" avatar="
    view:third;
    avatarDirection:180;
    walk:Robot_Walking;
    idle:Robot_Wave;
    cameraFollow:True;
    ">

        </a-entity>
        <a-box color="gold" position="0 2 -5">

        </a-box>

    </a-scene>

    <script src="index1.js"></script>


</body>

</html>
